[project]
name = "k8s-docs-mcp"
version = "0.1.0"
description = "Official Kubernetes Documentation & Canonical YAML Manifest MCP Server for AI Agents."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "villadalmine", email = "villadalmine@gmail.com" }
]
keywords = ["kubernetes", "mcp", "model-context-protocol", "k8s", "cncf", "ai-agents", "docs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Documentation",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/villadalmine/k8s-docs-mcp"
Repository = "https://github.com/villadalmine/k8s-docs-mcp.git"
Documentation = "https://kubernetes.io/docs/"

[project.scripts]
k8s-docs-mcp = "k8s_docs_mcp:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
